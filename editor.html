<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Нулевой Трибунал — Конструктор главы</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/editor.css">
</head>
<body class="editor-page">

<main class="editor-shell">
  <header class="editor-header">
    <div>
      <div class="editor-eyebrow">Нулевой Трибунал</div>
      <h1>Конструктор главы</h1>
      <p>Пиши прямо в визуальном окне или в коде, применяй стили и копируй готовый текст главы.</p>
    </div>
    <div class="editor-header__actions">
      <button type="button" class="editor-button editor-button--ghost" data-editor-undo title="Отменить (Ctrl+Z)">↶ Отмена</button>
      <button type="button" class="editor-button editor-button--ghost" data-editor-redo title="Повторить (Ctrl+Y)">↷ Повтор</button>
      <button type="button" class="editor-button editor-button--primary" data-editor-copy>Копировать HTML</button>
    </div>
  </header>

  <section class="editor-workspace">
    <div class="editor-main">
      <div class="editor-modebar">
        <div class="editor-tabs" role="tablist">
          <button type="button" class="editor-tab" data-editor-view="code">Код</button>
          <button type="button" class="editor-tab" data-editor-view="split">Рядом</button>
          <button type="button" class="editor-tab" data-editor-view="visual">Визуал</button>
        </div>
        <div class="editor-status">
          <span data-editor-wordcount>0 слов</span>
          <span class="editor-status__dot"></span>
          <span data-editor-saved>—</span>
        </div>
      </div>

      <div class="editor-stage" data-editor-stage data-view="split">
        <div class="editor-pane editor-pane--code" data-editor-pane="code">
          <textarea class="editor-code" data-editor-input spellcheck="false" aria-label="HTML главы"></textarea>
        </div>
        <div class="editor-pane editor-pane--visual" data-editor-pane="visual">
          <div class="editor-preview">
            <div class="reader editor-visual" data-editor-visual contenteditable="true" spellcheck="true" aria-label="Визуальный редактор"></div>
          </div>
        </div>
      </div>

      <div class="editor-footer">
        <button type="button" class="editor-button editor-button--ghost" data-editor-clear>Очистить</button>
        <div class="editor-footer__hint">Выдели текст в любом окне → выбери стиль справа. Изменения сохраняются сами.</div>
        <button type="button" class="editor-button editor-button--primary" data-editor-copy>Копировать HTML</button>
      </div>
    </div>

    <aside class="editor-sidebar">
      <div class="style-sidebar__header">
        <div>
          <div class="editor-eyebrow">Палитра</div>
          <h2>Стили текста</h2>
        </div>
        <span class="style-count" data-style-count>0</span>
      </div>
      <input type="search" class="style-search" data-style-search aria-label="Поиск стиля" autocomplete="off">
      <button type="button" class="style-clear" data-style-strip>Убрать оформление с выделения</button>
      <div class="style-list" data-style-list></div>
    </aside>
  </section>

  <section class="editor-output">
    <div class="editor-output__head">
      <div>
        <div class="editor-eyebrow">Результат</div>
        <h2>HTML для GitHub</h2>
      </div>
      <button type="button" class="editor-button editor-button--small" data-editor-copy>Копировать</button>
    </div>
    <pre class="editor-output__code"><code data-editor-output></code></pre>
  </section>
</main>

<div class="editor-toast" data-editor-toast aria-live="polite"></div>
<script src="assets/js/editor.js"></script>
</body>
</html>
